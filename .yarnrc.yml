# Yarn 4 configuration. See the toolchain declaration in
# features/pyramid-v2-epic/unblock-build/unblock-build.design.md
#
# The apps are Next.js builds deployed on Vercel and expect a real node_modules
# tree. Plug'n'Play is Yarn's default from v2 on, and it is deliberately not used
# here: tsc, next build and vitest all read the layout this repository already has.
nodeLinker: node-modules

# Keep downloaded archives in the shared global cache rather than committing a
# .yarn/cache directory. No zero-install.
enableGlobalCache: true

# Yarn 4.17 disables dependency build scripts by default. Several dependencies here
# ship native binaries built at install time — sharp (Next image optimisation),
# esbuild, @parcel/watcher, protobufjs — and are unusable without them.
enableScripts: true

# The Yarn binary itself, committed at .yarn/releases/yarn-4.17.1.cjs, 2.9 MB. This
# is Yarn's own documented workflow — `yarn set version 4.17.1 --yarn-path` — and it
# is what makes the install reproducible without corepack.
#
# Corepack downloads Yarn as a single `yarn.js` and, on Vercel, caches it inside the
# repository under .vercel/cache/corepack/. Node takes a .js file's module type from
# the nearest package.json above it, which there is this repository's root, and the
# root declares "type": "module". So Node loaded Yarn's CommonJS bundle as an ES
# module and it died on `Dynamic require of "util" is not supported` before
# installing anything. Six deployments failed that way on 2026-08-01, none of them
# reproducible locally, where corepack caches outside any package.
#
# A .cjs file is CommonJS whatever any manifest says, so this one loads correctly
# wherever it sits. Yarn 1 delegates to yarnPath when it finds one, which is the
# mechanism that predates corepack and does not depend on it.
yarnPath: .yarn/releases/yarn-4.17.1.cjs
