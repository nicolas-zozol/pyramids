# Yarn 4 configuration. See the toolchain declaration in
# features/pyramid-v2-epic/unblock-build/unblock-build.design.md
#
# Every app expects a real node_modules tree, and Netlify's build requires one.
# Plug'n'Play, Yarn's default, is not used: tsc, next build, Vite and vitest read
# this layout.
nodeLinker: node-modules

# Keep downloaded archives in the shared global cache rather than committing a
# .yarn/cache directory. No zero-install.
enableGlobalCache: true

# Yarn 4.17 disables dependency build scripts by default. Several dependencies here
# ship native binaries built at install time — sharp (Next image optimisation),
# esbuild, @parcel/watcher, protobufjs — and are unusable without them.
enableScripts: true

# The Yarn binary itself, committed at .yarn/releases/yarn-4.17.1.cjs, 2.9 MB, by
# Yarn's documented workflow, `yarn set version 4.17.1 --yarn-path`. Any yarn on the
# PATH delegates to it, Yarn 1 included. A .cjs file is CommonJS whatever any
# manifest says, so it loads wherever it sits.
#
# Corepack fetches Yarn as a single `yarn.js`. Cached inside the repository, as
# Vercel caches it under .vercel/cache/corepack/, it sits under the root
# package.json, which declares "type": "module": Node loads Yarn's CommonJS bundle
# as an ES module and the install dies on `Dynamic require of "util" is not
# supported`. Netlify's build image enables corepack with a cache outside the
# repository, and Yarn then hands over to this binary.
yarnPath: .yarn/releases/yarn-4.17.1.cjs

# @tanstack/react-start-rsc imports @tanstack/start-plugin-core, which binds `vite`
# as a peer, without declaring that peer itself. Undeclared, its plugin-core copy is
# hoisted to the root and binds the vite 6 that apps/robusta hoists, so the v2 site's
# build loads two Vite majors. Declared, it receives the site's own vite 8 through
# @tanstack/react-start (tanstack-start-migration, R-TANSTACK-04).
packageExtensions:
  "@tanstack/react-start-rsc@*":
    peerDependencies:
      vite: ">=7.0.0"
    peerDependenciesMeta:
      vite:
        optional: true
