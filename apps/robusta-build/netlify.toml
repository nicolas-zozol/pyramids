# The v2 site on Netlify, read from the package directory apps/robusta-build.
# The base directory is unset, so install and build run at the repository root:
# every path below is relative to it, and the root .nvmrc picks Node 22.
#
# Netlify publishes the prerendered client output, with no function, no header
# rule and no plugin. The first redirect rule, forced and matching the Netlify
# subdomain alone, leads every path of robusta-build.netlify.app permanently to
# the same path on www.robusta.build; www, branch deploys and deploy previews
# answer under their own host and are not redirected.
#
# The default Locale is served unprefixed, `/` being its landing page, an
# index.html like any other page. Two redirect rules lead a page marked with the
# default Locale permanently to the same page unmarked: `/en` to `/`, `/en/{rest}`
# to `/{rest}`. Without `force`, and no file existing under `en`, they always
# apply; a target the site does not build answers 404.
#
# The build also writes dist/client/_redirects, the v1 addresses of the v1 map
# (scripts/emit-redirects.mjs). Netlify reads it before the rules below, so a v1
# address on robusta-build.netlify.app takes two redirects. None of its rules is
# forced: every page the site builds keeps its answer.

[build]
  command = "node --version && yarn --version && yarn config get yarnPath && yarn build:robusta"
  publish = "apps/robusta-build/dist/client"
  # Exit 0 skips the build. Production always builds: the cached ref is the
  # last commit built on any branch, so a branch deploy would hide from main the
  # code it already built (FIX-PYRAMID-1). Elsewhere, scripts/netlify-ignore.mjs
  # exits 0 only when no commit of CACHED_COMMIT_REF..COMMIT_REF touches the site,
  # a module it reaches through the four dependency fields of the manifests at
  # COMMIT_REF, or a root install file. An absent, unknown or equal ref, a cached
  # ref off the first-parent history of COMMIT_REF, and any error exit 1 and build.
  # It prints one line, `skip: <reason>` or `build: <reason>`.
  ignore = "[ \"$CONTEXT\" = production ] && exit 1; node apps/robusta-build/scripts/netlify-ignore.mjs @robusta/robusta-build"

[build.environment]
  # Netlify's default, --ignore-optional, is an unknown option to yarn 4.
  YARN_FLAGS = "--immutable"

[[redirects]]
  from = "https://robusta-build.netlify.app/*"
  to = "https://www.robusta.build/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
