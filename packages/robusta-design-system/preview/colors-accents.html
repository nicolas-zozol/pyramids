<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col">
  <div class="row" style="gap:14px;flex-wrap:wrap">
    <div style="width:150px"><div style="background:var(--brand-primary);height:64px;border:1.5px solid #1a1a1a"></div><div class="label" style="margin-top:6px">primary · #562571</div><div class="label" style="color:#6b6b66">royal purple</div></div>
    <div style="width:150px"><div style="background:var(--brand-primary-deep);height:64px;border:1.5px solid #1a1a1a"></div><div class="label" style="margin-top:6px">primary-deep · #3a1850</div></div>
    <div style="width:150px"><div style="background:var(--brand-primary-soft);height:64px;border:1.5px solid #1a1a1a"></div><div class="label" style="margin-top:6px">primary-soft · #e7d8f0</div></div>
  </div>
  <div class="row" style="gap:14px;flex-wrap:wrap">
    <div style="width:150px"><div style="background:var(--brand-secondary);height:64px;border:1.5px solid #1a1a1a"></div><div class="label" style="margin-top:6px">secondary · #FFCC3F</div><div class="label" style="color:#6b6b66">champagne gold</div></div>

  </div>
  <div class="row" style="gap:14px;flex-wrap:wrap">
    <div style="width:150px"><div style="background:var(--brand-accent);height:64px;border:1.5px solid #1a1a1a"></div><div class="label" style="margin-top:6px">accent · #0B65C2</div><div class="label" style="color:#6b6b66">signal blue · links / focus</div></div>
    <div style="width:150px"><div style="background:var(--brand-accent-deep);height:64px;border:1.5px solid #1a1a1a"></div><div class="label" style="margin-top:6px">accent-deep · #074a8f</div></div>
    <div style="width:150px"><div style="background:var(--brand-accent-soft);height:64px;border:1.5px solid #1a1a1a"></div><div class="label" style="margin-top:6px">accent-soft · #cfe2f5</div></div>
