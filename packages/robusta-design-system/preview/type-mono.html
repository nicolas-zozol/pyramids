<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

</head><body>
<div class="col" style="gap:14px">
  <div>
    <pre style="margin:0;font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:14px;background:#f3f1ea;border:2px solid #1a1a1a;border-radius:6px;padding:14px 18px;line-height:1.5">// retry on transient failure, with jitter

  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span style="font-size:14px;color:#6b6b66">inline:</span>
    <code style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:14px;background:#f3f1ea;border:1.5px solid #1a1a1a;border-radius:3px;padding:2px 8px">p99 &lt; 200ms</code>
    <code style="font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:14px;background:#f3f1ea;border:1.5px solid #1a1a1a;border-radius:3px;padding:2px 8px">retry-with-jitter</code>
  </div>
</div>
