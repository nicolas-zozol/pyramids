<style>body{padding:32px;background:#fafaf7;margin:0;display:flex;flex-direction:column;gap:36px}
.row{display:flex;align-items:center;gap:24px}
.label{font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:13px;color:#6b6b66}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="../ui_kits/marketing/BrandLogo.jsx"></script>

    <div style={{display:'flex',flexDirection:'column',gap:32}}>
      <div className="row"><BrandLogo size="full"/><span className="label">full · with tagline</span></div>
